name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalacja
        run: |
          npm install
          mkdir -p www/lib
          cp -r node_modules/leaflet/dist/* www/lib/
      - name: Projekt Android
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          P=""
          for x in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS WAKE_LOCK; do P="$P<uses-permission android:name=\"android.permission.$x\"/>"; done
          sed -i "s#</manifest>#$P</manifest>#" $M
          cat > android/app/src/main/java/com/example/predkosciomierz/MainActivity.java <<'JEOF'
          package com.example.predkosciomierz;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
          }
          JEOF
          npx cap sync android
      - name: Budowanie APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Wydanie z APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Predkosciomierz ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
