<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="lib/leaflet.css"><script src="lib/leaflet.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px 10px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}
#clk{font:700 30px "Courier New",monospace;color:#ff9800}
.top button{background:#1a1a1a;color:#ff9800;border:1px solid #ff9800;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:700;margin-left:6px}
#main{flex:1;position:relative;min-height:0}
.p{position:absolute;inset:0}
.h{display:none}
#gv{display:flex;flex-direction:column;align-items:center;justify-content:center}
#sv{width:100%;max-width:380px}
#nd{transform-origin:150px 150px;transition:transform .35s;filter:drop-shadow(0 0 5px #f00)}
#big{font:700 84px "Courier New",monospace;color:#ff9800;line-height:1;margin-top:-6px}
#big small{font-size:20px;color:#aaa}
#map{position:absolute;inset:0;border-radius:14px}
#fab{position:absolute;right:12px;bottom:14px;z-index:1000;width:54px;height:54px;border-radius:50%;border:2px solid #ff9800;background:#000;color:#ff9800;font-size:26px}
#ms{position:absolute;left:12px;top:12px;z-index:1000;background:#000c;border:1px solid #ff9800;border-radius:10px;padding:6px 12px;font:700 24px "Courier New",monospace;color:#ff9800}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.info div{background:#111;border-radius:10px;padding:8px 2px}
.info small{display:block;font-size:11px;color:#999}
.info b{font:700 20px "Courier New",monospace;color:#ff9800}
#msg{text-align:center;font-size:13px;color:#ff9800;margin:8px 0}
.b{display:flex;gap:8px}
.b button{flex:1;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:700;color:#fff;background:#22c55e}
.b .rs{background:#2a2a2a;flex:.5}.b .st{background:#ef4444}
</style></head><body>
<div class="top"><span id="clk">00:00</span><span><button id="tm">🗺 Mapa</button></span></div>
<div id="main">
<div class="p" id="gv"><svg viewBox="0 0 300 300" id="sv"><path d="M150 275 A125 125 0 1 1 275 150" fill="none" stroke="#ccc" stroke-width="7"/><g id="tk"></g>
<g id="nd"><line x1="150" y1="150" x2="150" y2="262" stroke="#f33" stroke-width="7" stroke-linecap="round"/><line x1="150" y1="150" x2="150" y2="262" stroke="#fff" stroke-width="2"/></g>
<circle cx="150" cy="150" r="9" fill="#222" stroke="#888"/><text x="215" y="235" fill="#ddd" font-size="20" transform="rotate(-40 215 235)">km/h</text></svg>
<div id="big">0<small> km/h</small></div></div>
<div class="p h" id="mw"><div id="map"></div><div id="ms">0 km/h</div><button id="fab">📍</button></div>
</div>
<div class="info"><div><small>TRIP km</small><b id="dist">0.00</b></div><div><small>ŚR. km/h</small><b id="avg">0</b></div><div><small>MAX km/h</small><b id="max">0</b></div><div><small>CZAS</small><b id="time">0:00:00</b></div></div>
<div id="msg">Nawiązywanie połączenia GPS…</div>
<div class="b"><button id="go">Start</button><button class="rs" id="rs">Reset</button></div>
<script>
var $=function(i){return document.getElementById(i)};
var el=0,rec=false,dist=0,maxv=0,mov=0,last=null,cur=0,pos=null,map,me,acc,line,follow=true,lock=null,view=1;
function P(t,r){var a=t*Math.PI/180;return[150-r*Math.sin(a),150+r*Math.cos(a)]}
(function(){var s='';for(var v=0;v<=240;v+=10){var t=v*270/240,M=v%20==0,a=P(t,M?106:112),b=P(t,125);
 s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#ccc" stroke-width="'+(M?4:2)+'"/>';
 if(M){var l=P(t,88);s+='<text x="'+l[0]+'" y="'+(l[1]+6)+'" fill="#ddd" font-size="17" text-anchor="middle">'+v+'</text>'}}
 $('tk').innerHTML=s})();
function clock(){var d=new Date();$('clk').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
clock();setInterval(clock,10000);
function f(s){s=Math.floor(s);return Math.floor(s/3600)+':'+('0'+Math.floor(s%3600/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function hav(a,b){var r=Math.PI/180,x=Math.sin((b[0]-a[0])*r/2),y=Math.sin((b[1]-a[1])*r/2);
 return 12742000*Math.asin(Math.sqrt(x*x+Math.cos(a[0]*r)*Math.cos(b[0]*r)*y*y))}
function upd(){var v=Math.round(cur);
 $('big').innerHTML=v+'<small> km/h</small>';$('ms').textContent=v+' km/h';
 $('nd').style.transform='rotate('+Math.min(cur,240)*270/240+'deg)';
 $('dist').textContent=(dist/1000).toFixed(2);$('max').textContent=Math.round(maxv);
 $('time').textContent=f(el);$('avg').textContent=mov>0?Math.round(dist/mov*3.6):0}
function initMap(){if(map)return;map=L.map('map',{zoomControl:false}).setView(pos||[52,19],pos?17:6);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 line=L.polyline([],{color:'#ff9800',weight:5}).addTo(map);
 acc=L.circle(pos||[0,0],{radius:20,color:'#3b9cff',weight:1,fillOpacity:.12}).addTo(map);
 me=L.marker(pos||[0,0],{icon:L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:#3b9cff;border:3px solid #fff;box-shadow:0 0 0 7px #3b9cff55"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);
 map.on('dragstart',function(){follow=false})}
function center(){if(!pos||!map)return;follow=true;map.setView(pos,Math.max(map.getZoom(),17),{animate:false})}
$('fab').onclick=center;
$('tm').onclick=function(){view=view==1?2:1;$('gv').classList.toggle('h',view!=1);$('mw').classList.toggle('h',view!=2);
 $('tm').textContent=view==1?'🗺 Mapa':'⏱ Zegar';
 if(view==2){initMap();setTimeout(function(){map.invalidateSize();if(pos){me.setLatLng(pos);acc.setLatLng(pos);follow=true;center()}},60)}};
function onPos(p){var c=p.coords,t=p.timestamp,pt=[c.latitude,c.longitude],q=Math.max(0,Math.min(100,Math.round(100-(c.accuracy-5)*100/45)));
 pos=pt;$('msg').textContent='GPS: ±'+Math.round(c.accuracy)+' m • jakość sygnału '+q+'%'+(c.accuracy>50?' – wyjdź na zewnątrz':'');
 if(map){me.setLatLng(pt);acc.setLatLng(pt).setRadius(c.accuracy);if(follow&&view==2)map.setView(pt,Math.max(map.getZoom(),17),{animate:false})}
 var v=c.speed!=null?c.speed*3.6:null;
 if(last){var d=hav(last.p,pt),dt=(t-last.t)/1000;
  if(dt>0){if(v==null)v=d>c.accuracy*0.5?d/dt*3.6:0;
   if(v>=3&&c.accuracy<=100&&rec&&d>=2){dist+=d;mov+=dt;if(line)line.addLatLng(pt)}}}
 last={p:pt,t:t};
 if(v==null)v=0;cur=v<3?0:v;if(rec&&cur>maxv)maxv=cur;upd()}
function err(e){$('msg').textContent=e.code==1?'Brak zgody na lokalizację – włącz ją w ustawieniach.':'Błąd GPS: '+e.message}
navigator.geolocation.watchPosition(onPos,err,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
$('go').onclick=async function(){rec=!rec;
 if(rec){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}else if(lock){lock.release();lock=null}
 $('go').textContent=rec?'Stop':'Start';$('go').classList.toggle('st',rec)};
setInterval(function(){if(rec){el++;upd()}},1000);
$('rs').onclick=function(){el=0;dist=0;maxv=0;mov=0;if(line)line.setLatLngs([]);upd()};
upd();
</script></body></html>
